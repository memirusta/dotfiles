# Snappy Switcher — Emir (Alt+Tab). Colours come from the Caelestia scheme:
# themes/caelestia.ini is rewritten by ~/.config/hypr/scripts/caelestia-theme-hook.sh on every wallpaper change.

[general]
# Every window as its own card, like Windows
mode = overview
follow_monitor = true
show_workspace_badge = true
sticky_mode = false
ignore_pinned = true
# Minimized windows live on special:minimized and must stay in Alt+Tab
ignore_special = false

[theme]
name = caelestia.ini
border_width = 1
card_border_width = 2
corner_radius = 18

[layout]
card_width = 150
card_height = 135
card_gap = 10
padding = 12
max_cols = 6
icon_size = 56
icon_radius = 14

[icons]
theme = Papirus-Dark
fallback = hicolor
show_letter_fallback = true

[font]
family = Segoe UI Variable
weight = Medium
title_size = 10
icon_letter_size = 24
